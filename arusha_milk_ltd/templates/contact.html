{% extends 'base.html' %}
{% load static %}

{% block title %}Contact{% endblock %}

{% block content %}


<!-- Page Header Start -->
<div class="container-fluid page-header mb-5 position-relative overlay-bottom">
    <div class="d-flex flex-column align-items-center justify-content-center pt-0 pt-lg-5" style="min-height: 400px">
        <h1 class="display-4 mb-3 mt-0 mt-lg-5 text-white text-uppercase">Contact Us</h1>
        <div class="d-inline-flex mb-lg-5">
            <p class="m-0 text-white">
                <a class="text-white" href="{% url 'arusha_milk_ltd:index' %}">Home</a>
            </p>
            <p class="m-0 text-white px-2">/</p>
            <p class="m-0 text-white">Contact</p>
        </div>
    </div>
</div>
<!-- Page Header End -->


<!-- Contact Start -->
<div class="container-fluid pt-5">
    <div class="container">
        <div class="section-title">
            <h4 class="text-primary text-uppercase" style="letter-spacing: 5px;">Contact Us</h4>
            <h1 class="display-4">Get In Touch With Us</h1>
        </div>

        <div class="row px-3 pb-2">
            <div class="col-sm-4 text-center mb-3">
                <i class="fa fa-2x fa-map-marker-alt mb-3 text-primary"></i>
                <h4 class="font-weight-bold">Address</h4>
                <p>Sokoine Road, Arusha, Tanzania</p>
            </div>
            <div class="col-sm-4 text-center mb-3">
                <i class="fa fa-2x fa-phone-alt mb-3 text-primary"></i>
                <h4 class="font-weight-bold">Phone</h4>
                <p>0760 144 638</p>
            </div>
            <div class="col-sm-4 text-center mb-3">
                <i class="far fa-2x fa-envelope mb-3 text-primary"></i>
                <h4 class="font-weight-bold">Email</h4>
                <p>info@arushamilk.co.tz</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 pb-5">
                <iframe style="width: 100%; height: 443px;"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3980.8850657498077!2d36.68186611476004!3d-3.386420897537133!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x18371e4efba07e19%3A0x95ab305d5d0cde12!2sArusha%2C%20Tanzania!5e0!3m2!1sen!2s!4v1620000000000!5m2!1sen!2s"
                    frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="col-md-6 pb-5">
                <div class="contact-form">
                    <form method="POST">
                        {% csrf_token %}

                        <input type="text" name="name" class="form-control bg-transparent p-4 mb-3" placeholder="Your Name" required>
                        <input type="email" name="email" class="form-control bg-transparent p-4 mb-3" placeholder="Your Email" required>
                        <input type="text" name="subject" class="form-control bg-transparent p-4 mb-3" placeholder="Subject" required>
                        <textarea name="message" class="form-control bg-transparent py-3 px-4 mb-3" rows="5" placeholder="Message" required></textarea>

                        <button class="btn btn-primary font-weight-bold py-3 px-5" type="submit">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Contact End -->


<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top">
    <i class="fa fa-angle-double-up"></i>
</a>

{% endblock %}
